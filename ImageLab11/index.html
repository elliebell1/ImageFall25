<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
       <a-assets>
        <img id="sky" src="assets/AdobeStock_286725174 copy.jpg" alt="">
        <a-asset-item id="pine-tree-snow-1-obj" src="assets/PineTree_Snow_1.obj"></a-asset-item>
        <a-asset-item id="pine-tree-snow-1-mtl" src="assets/PineTree_Snow_1.mtl"></a-asset-item>

        <a-asset-item id="campfire-stones-obj" src="assets/campfire_stones.obj"></a-asset-item>
        <a-asset-item id="campfire-stones-mtl" src="assets/campfire_stones.mtl"></a-asset-item>

        <a-asset-item id="campfire-logs-obj" src="assets/campfire_logs.obj"></a-asset-item>
        <a-asset-item id="campfire-logs-mtl" src="assets/campfire_logs.mtl"></a-asset-item>
      </a-assets>

      <a-box width="200" depth="200" density="40" opacity="1" position="1 -0.4 0" color = "#c6c1e3" shadow="receive: true"></a-box>    
      <a-sky src="#sky" position="0 0 0"></a-sky> 
      <a-obj-model src="#pine-tree-snow-1-obj" mtl="#pine-tree-snow-1-mtl" position="-3 -0.4 -5" scale="1.75 1.75 1.5" rotation="0 120 0" shadow="cast: true"></a-obj-model>
      <a-obj-model src="#campfire-stones-obj" material="color: #707070" position="1 0 -4" scale="5 5 5" rotation="0 0 0" shadow="cast: true"></a-obj-model>
      <a-obj-model src="#campfire-logs-obj" material="color: #57380f" position="0.9 0 -3.9" scale="5 5 5" rotation="0 20 0" shadow="cast: true"></a-obj-model>
      
      <a-entity light="type: point; color: #ff6600; intensity: 2; distance: 10; decay: 2" 
          position="1 .5 -4"
          animation="property: light.intensity; from: 1.5; to: 2.5; dur: 500; dir: alternate; loop: true">
        </a-entity>
        <!-- <a-entity light="type: spot; color: #ff6600; intensity: 5; distance: 10; decay: 2" 
          position="1 .6 -3.1"
          animation="property: light.intensity; from: 1.5; to: 2.5; dur: 500; dir: alternate; loop: true">
        </a-entity> -->

    <a-entity
        light="type: directional; 
              color: #ccdfff; 
              intensity: 1.2; 
              castShadow: true"
        position="5 10 5"
        rotation="-60 45 0">
    </a-entity>
    <a-entity light="type: hemisphere; skyColor: #151b36; groundColor: #867596; intensity: 0.3"></a-entity>
    <a-entity light="type: ambient; color: #efb5ff; intensity: 0.8"></a-entity>
    </a-scene>
  </body>
</html>
