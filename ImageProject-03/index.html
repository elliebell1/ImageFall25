    <script>
      AFRAME.registerComponent('emissive-bulbs', {
        schema: {
          color: { type: 'color', default: '#FFD45A' }, // default bulb color
          intensity: { type: 'number', default: 3.0 }   // emissive intensity
        },

        init() {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            mesh.traverse(node => {
              if (!node.isMesh || !node.material) return;

              const name = node.material.name;

              // Only target bulb materials
              if (name === "Light" || name === "Light_Tip") {
                // Clone material so other instances aren't affected
                node.material = node.material.clone();

                // Set the emissive color to your chosen color
                node.material.emissive = new THREE.Color(this.data.color);
                node.material.emissiveIntensity = this.data.intensity;
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
      
    </script>
