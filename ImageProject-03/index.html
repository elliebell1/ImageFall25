    <script>
      AFRAME.registerComponent('emissive-bulbs', {
        schema: {
          color: { type: 'color', default: '#FFD45A' },
          intensity: { type: 'number', default: 3.0 } 
        },

        init() {
          this.el.addEventListener('model-loaded', () => {
            const mesh = this.el.getObject3D('mesh');
            mesh.traverse(node => {
              if (!node.isMesh || !node.material) return;

              const name = node.material.name;

              if (name === "Light" || name === "Light_Tip") {
                node.material = node.material.clone();

                node.material.emissive = new THREE.Color(this.data.color);
                node.material.emissiveIntensity = this.data.intensity;
                node.material.needsUpdate = true;
              }
            });
          });
        }
      });
      
    </script>
