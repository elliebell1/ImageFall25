<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 0.75 -4" radius="1" color="#F5FBFF"></a-sphere>
      <a-sphere position="0 2 -4" radius=".6" color="#F5FBFF"></a-sphere>
      <a-sphere position="-0.25 2 -3.475" radius=".075" color="#1a050d"></a-sphere>
      <a-sphere position="0.25 2 -3.475" radius=".075" color="#1a050d"></a-sphere>
      <a-cone position="0 1.9 -3.4" rotation="90 0 0" color="#f25f49" radius-bottom=".15" radius-top="0.025" height="0.4"></a-cone>
      <a-sphere position="0 1.4 -3.25" radius=".075" color="#1a050d"></a-sphere>
      <a-sphere position="0 1.2 -3.125" radius=".075" color="#1a050d"></a-sphere>
      <a-sphere position="0 1 -3.05" radius=".075" color="#1a050d"></a-sphere>
      <a-cylinder position="0 1.5 -4" radius="0.6" color="#9c191d" height=".5"></a-cylinder> 
      <a-cylinder position="0 2.35 -4" radius="0.7" color="#1a050d" height=".25"></a-cylinder> 
      <a-cylinder position="0 2.6 -4" radius="0.6" color="#1a050d" height=".75"></a-cylinder> 
      <a-cylinder position="-.9 1.3 -4" radius="0.05" color="#422215" height="1" rotation="0 0 80"></a-cylinder> 
            <a-cylinder position=".9 1.3 -4" radius="0.05" color="#422215" height="1" rotation="0 0 100"></a-cylinder> 
      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="#c3d6eb"></a-plane>
      <!-- <a-sky color="#ECECEC"></a-sky> -->
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: japan; dressingAmount: 1"></a-entity>
    </a-scene>
  </body>
</html>
